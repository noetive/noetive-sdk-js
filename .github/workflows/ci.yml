name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request runs are cancelled; every commit on main keeps its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, typecheck, unit tests, pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Version comes from package.json#packageManager.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: latest
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm pack --pack-destination "$RUNNER_TEMP/pack"
      - name: Check tarball contents
        run: |
          tarball=$(ls "$RUNNER_TEMP"/pack/*.tgz)
          listing=$(tar -tzf "$tarball")
          for f in package.json README.md LICENSE SECURITY.md dist/index.js dist/index.cjs; do
            grep -qx "package/$f" <<<"$listing" || { echo "::error::$f missing from $tarball"; exit 1; }
          done
      # Every export condition must resolve to types of the matching module
      # format under Node's resolution and bundlers.
      - name: Check types per export condition
        run: pnpm dlx @arethetypeswrong/cli@latest --profile node16 "$RUNNER_TEMP"/pack/*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-tarball
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error
          retention-days: 7

  # Installs the packed tarball the way customers do, with each package
  # manager at its latest release, and runs test/consumer against it.
  consumer:
    name: Consumer (${{ matrix.pm }})
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Yarn makes installs immutable when CI=true, which refuses to create the
      # consumer project's first lockfile. The other package managers ignore it.
      YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
    strategy:
      fail-fast: false
      matrix:
        include:
          - pm: npm
            setup: npm install --global npm@latest
            add: npm install --no-audit --no-fund
            run: node
            tsc: npx tsc
          - pm: pnpm
            setup: npm install --global pnpm@latest
            add: pnpm add
            run: node
            tsc: pnpm exec tsc
          # Yarn's default Plug'n'Play linker is the strictest resolver here.
          # TypeScript 7 cannot resolve through Plug'n'Play, so types are
          # checked by the other package managers only.
          - pm: yarn
            setup: npm install --global corepack@latest && corepack enable yarn && corepack use yarn@stable
            add: yarn add
            run: yarn node
            tsc: ""
          - pm: bun
            setup: bun --version
            add: bun add
            run: bun
            tsc: bun x tsc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: test/consumer
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: latest
          package-manager-cache: false
      - if: matrix.pm == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-tarball
          path: ${{ runner.temp }}/pack
      - name: Create consumer project
        working-directory: ${{ runner.temp }}
        run: |
          mkdir consumer
          cp "$GITHUB_WORKSPACE"/test/consumer/* consumer/
          echo '{"name":"consumer","private":true}' > consumer/package.json
      - name: Set up ${{ matrix.pm }}
        working-directory: ${{ runner.temp }}/consumer
        run: ${{ matrix.setup }}
      - name: Install the SDK tarball
        working-directory: ${{ runner.temp }}/consumer
        run: |
          tarball=$(ls "$RUNNER_TEMP"/pack/*.tgz)
          ${{ matrix.add }} "@noetive/sdk@file:$tarball" typescript@latest
      - name: ESM smoke test
        working-directory: ${{ runner.temp }}/consumer
        run: ${{ matrix.run }} smoke.mjs
      - name: CJS smoke test
        working-directory: ${{ runner.temp }}/consumer
        run: ${{ matrix.run }} smoke.cjs
      - name: Type check
        if: matrix.tsc != ''
        working-directory: ${{ runner.temp }}/consumer
        run: ${{ matrix.tsc }} -p tsconfig.json

  # Full suite against the live service. Needs the NOETIVE_KEY_SECRET
  # repository secret, which pull requests from forks never receive.
  integration:
    name: Integration (live)
    needs: check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: latest
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The suite skips itself without a key; fail instead of passing empty.
      - name: Require API key
        env:
          NOETIVE_KEY_SECRET: ${{ secrets.NOETIVE_KEY_SECRET }}
        run: |
          if [ -z "$NOETIVE_KEY_SECRET" ]; then
            echo "::error::NOETIVE_KEY_SECRET repository secret is not set"
            exit 1
          fi
      - run: pnpm run test:integration
        env:
          NOETIVE_KEY_SECRET: ${{ secrets.NOETIVE_KEY_SECRET }}
